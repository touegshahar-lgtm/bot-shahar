  data: new SlashCommandBuilder()
    .setName('mute')
    .setDescription('Mute a user')
    .addUserOption(option => 
      option.setName('user')
        .setDescription('The user to mute')
        .setRequired(true))
    .addIntegerOption(option => 
      option.setName('duration')
        .setDescription('Duration in minutes (0 for permanent)')
        .setRequired(false))
    .addStringOption(option => 
      option.setName('reason')
        .setDescription('Reason for muting')
        .setRequired(false)),
  async execute(interaction, client) {
    // Check permissions
    if (!interaction.member.permissions.has(PermissionsBitField.Flags.ModerateMembers)) {
      return interaction.reply({ content: '❌ You do not have permission to use this command!', ephemeral: true });
    }
    
    const user = interaction.options.getUser('user');
    const duration = interaction.options.getInteger('duration') || 0;
    const reason = interaction.options.getString('reason') || 'No reason provided';
    
    try {
      const member = await interaction.guild.members.fetch(user.id);
      
      // Create muted role if it doesn't exist
      let mutedRole = interaction.guild.roles.cache.find(role => role.name === 'Muted');
      if (!mutedRole) {
        mutedRole = await interaction.guild.roles.create({
          name: 'Muted',
          permissions: [],
          reason: 'Creating muted role for mute command'
        });
        
        // Set permissions for all text channels
        interaction.guild.channels.cache.filter(ch => ch.isTextBased()).forEach(channel => {
          channel.permissionOverwrites.edit(mutedRole, {
            SendMessages: false,
            AddReactions: false,
            Speak: false,
            Connect: false
          });
        });
      }
      
      // Apply mute
      if (duration > 0) {
        await member.timeout(duration * 60000, reason);
      } else {
        await member.roles.add(mutedRole, reason);
      }
      
      const embed = new EmbedBuilder()
        .setColor('#ff0000')
        .setTitle('✅ User Muted')
        .addFields(
          { name: 'User', value: user.tag, inline: true },
          { name: 'Moderator', value: interaction.user.tag, inline: true },
          { name: 'Duration', value: duration > 0 ? `${duration} minutes` : 'Permanent', inline: true },
          { name: 'Reason', value: reason }
        )
        .setTimestamp();
      
      await interaction.reply({ embeds: [embed] });
      
      // Send DM to muted user
      try {
        await user.send(`You have been muted in ${interaction.guild.name} for: ${reason}`);
      } catch (e) {
        // If DM fails, ignore
      }
    } catch (error) {
      console.error(error);
      await interaction.reply({ content: '❌ Failed to mute user. Make sure I have the proper permissions.', ephemeral: true });
    }
  }
};
