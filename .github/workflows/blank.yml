```javascript
// === INSTALLATION INSTRUCTIONS ===
// 1. Create a new folder and run: npm init -y
// 2. Install required packages:
//    npm install discord.js @discordjs/voice dotenv node-cron fs-extra
// 3. Create a .env file with DISCORD_TOKEN=your_bot_token_here
// 4. Run with: node bot.js

// === .env.example ===
// DISCORD_TOKEN=your_bot_token_here
// CLIENT_ID=your_application_id_here
// GUILD_ID=your_guild_id_here (optional, for guild-specific commands)

const { Client, Collection, GatewayIntentBits, Partials, EmbedBuilder, ActionRowBuilder, ButtonBuilder, ButtonStyle, PermissionsBitField } = require('discord.js');
const { joinVoiceChannel, createAudioPlayer, createAudioResource, AudioPlayerStatus, getVoiceConnection } = require('@discordjs/voice');
const cron = require('node-cron');
const fs = require('fs-extra');
const path = require('path');

// Environment variables
require('dotenv').config();

// Initialize client
const client = new Client({
  intents: [
    GatewayIntentBits.Guilds,
    GatewayIntentBits.GuildMembers,
    GatewayIntentBits.GuildMessages,
    GatewayIntentBits.MessageContent,
    GatewayIntentBits.GuildVoiceStates,
    GatewayIntentBits.GuildPresences, // Required for online alerts
    GatewayIntentBits.DirectMessages,
  ],
  partials: [Partials.Channel, Partials.Message, Partials.User, Partials.GuildMember, Partials.Reaction],
});

// Collections
client.commands = new Collection();
client.cooldowns = new Collection();
client.queues = new Collection();
client.alerts = new Collection();
client.xp = new Collection(); // For XP system
client.reactionRoles = new Collection();

// Load commands
const commandFolders = fs.readdirSync('./commands');
for (const folder of commandFolders) {
  const commandFiles = fs.readdirSync(`./commands/${folder}`).filter(file => file.endsWith('.js'));
  for (const file of commandFiles) {
    const command = require(`./commands/${folder}/${file}`);
    client.commands.set(command.data.name, command);
  }
}

// Load events
const eventFiles = fs.readdirSync('./events').filter(file => file.endsWith('.js'));
for (const file of eventFiles) {
  const event = require(`./events/${file}`);
  if (event.once) {
    client.once(event.name, (...args) => event.execute(...args, client));
  } else {
    client.on(event.name, (...args) => event.execute(...args, client));
  }
}

// Load alerts from file on startup
async function loadAlerts() {
  try {
    const alertsPath = path.join(__dirname, 'alerts.json');
    if (await fs.pathExists(alertsPath)) {
      const data = await fs.readJson(alertsPath);
      for (const [id, alert] of Object.entries(data)) {
        client.alerts.set(id, alert);
      }
      console.log(`Loaded ${client.alerts.size} alerts`);
    } else {
      await fs.writeJson(alertsPath, {});
      console.log('Created alerts.json');
    }
  } catch (error) {
    console.error('Error loading alerts:', error);
  }
}

// Save alerts to file
async function saveAlerts() {
  try {
    const alertsPath = path.join(__dirname, 'alerts.json');
    const data = {};
    client.alerts.forEach((alert, id) => {
      data[id] = alert;
    });
    await fs.writeJson(alertsPath, data, { spaces: 2 });
  } catch (error) {
    console.error('Error saving alerts:', error);
  }
}

// Start alert monitors
function startAlertMonitors() {
  // Milestone alerts - handled in memberAdd/remove events
  // Online alerts - handled in presenceUpdate event
  // Schedule alerts - use cron
  client.alerts.forEach((alert, id) => {
    if (alert.type === 'schedule') {
      try {
        cron.schedule(alert.cron, async () => {
          try {
            await executeAlert(id, alert);
          } catch (error) {
            console.error(`Error executing scheduled alert ${id}:`, error);
          }
        });
      } catch (error) {
        console.error(`Invalid cron expression for alert ${id}:`, alert.cron);
      }
    }
  });
}

// Execute an alert
async function executeAlert(id, alert) {
  try {
    switch (alert.type) {
      case 'announce':
        if (alert.channelId) {
          const channel = await client.channels.fetch(alert.channelId);
          if (channel?.isTextBased()) {
            await channel.send({ content: alert.message });
          }
        }
        break;
      case 'milestone':
        if (alert.guildId) {
          const guild = await client.guilds.fetch(alert.guildId);
          if (guild.memberCount >= alert.count) {
            if (alert.channelId) {
              const channel = await client.channels.fetch(alert.channelId);
              if (channel?.isTextBased()) {
                await channel.send({ content: alert.message });
              }
            }
          }
        }
        break;
      case 'online':
        if (alert.userId && alert.channelId) {
          const user = await client.users.fetch(alert.userId);
          const guild = await client.guilds.fetch(alert.guildId);
          const member = await guild.members.fetch(user.id);
          if (member.presence?.status === 'online' || member.presence?.status === 'idle' || member.presence?.status === 'dnd') {
            const channel = await client.channels.fetch(alert.channelId);
            if (channel?.isTextBased()) {
              await channel.send({ content: alert.message.replace('{user}', `<@${user.id}>`) });
            }
          }
        }
        break;
      case 'schedule':
        if (alert.channelId) {
          const channel = await client.channels.fetch(alert.channelId);
          if (channel?.isTextBased()) {
            await channel.send({ content: alert.message });
          }
        }
        break;
      default:
        console.warn(`Unknown alert type: ${alert.type}`);
    }
  } catch (error) {
    console.error(`Error executing alert ${id}:`, error);
  }
}

// Initialize bot
client.once('ready', async () => {
  console.log(`✅ ${client.user.tag} is online!`);
  console.log(`📊 Serving ${client.guilds.cache.size} servers`);
  
  // Set activity
  client.user.setActivity('shahar Toueg | /help', { type: 3 });
  
  // Load alerts
  await loadAlerts();
  
  // Start alert monitors
  startAlertMonitors();
  
  // Register slash commands
  const commands = [];
  client.commands.forEach(command => {
    commands.push(command.data.toJSON());
  });

  // Global commands (for all servers)
  await client.application.commands.set(commands);
  console.log(`✅ Registered ${commands.length} slash commands globally`);
});

// Handle interactions
client.on('interactionCreate', async interaction => {
  if (!interaction.isChatInputCommand()) return;

  const command = client.commands.get(interaction.commandName);
  if (!command) {
    console.error(`No command matching ${interaction.commandName} was found.`);
    return;
  }

  // Cooldown handling
  const { cooldowns } = client;
  const now = Date.now();
  const timestamps = cooldowns.get(interaction.commandName) || new Map();
  const defaultCooldownDuration = 3000;
  const cooldownAmount = (command.cooldown || defaultCooldownDuration);

  if (timestamps.has(interaction.user.id)) {
    const expirationTime = timestamps.get(interaction.user.id) + cooldownAmount;
    if (now < expirationTime) {
      const timeLeft = (expirationTime - now) / 1000;
      return interaction.reply({ 
        content: `⏱️ Please wait ${timeLeft.toFixed(1)} seconds before using \`${interaction.commandName}\` again.`, 
        ephemeral: true 
      });
    }
  }

  timestamps.set(interaction.user.id, now);
  cooldowns.set(interaction.commandName, timestamps);
  setTimeout(() => timestamps.delete(interaction.user.id), cooldownAmount);

  try {
    await command.execute(interaction, client);
  } catch (error) {
    console.error(`Error executing ${interaction.commandName}:`, error);
    if (interaction.replied || interaction.deferred) {
      await interaction.followUp({ 
        content: '❌ There was an error while executing this command!', 
        ephemeral: true 
      });
    } else {
      await interaction.reply({ 
        content: '❌ There was an error while executing this command!', 
        ephemeral: true 
      });
    }
  }
});

// Login
client.login(process.env.DISCORD_TOKEN).catch(console.error);
