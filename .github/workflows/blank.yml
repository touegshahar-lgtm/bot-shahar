// ./events/guildMemberAdd.js
const { EmbedBuilder } = require('discord.js');

module.exports = {
  name: 'guildMemberAdd',
  async execute(member, client) {
    const guild = member.guild;
    
    // Welcome message
    const welcomeChannel = guild.channels.cache.find(ch => ch.name === 'welcome');
    if (welcomeChannel && welcomeChannel.isTextBased()) {
      const welcomeEmbed = new EmbedBuilder()
        .setColor('#00ff00')
        .setTitle('👋 Welcome!')
        .setDescription(`Welcome to ${guild.name}, ${member}!`)
        .setThumbnail(member.displayAvatarURL())
        .addFields(
          { name: 'Rules', value: 'Please read the rules in <#rules-channel-id>' },
          { name: 'Get Started', value: 'Type `/help` to see available commands!' }
        )
        .setTimestamp();
      
      await welcomeChannel.send({ embeds: [welcomeEmbed] });
    }
    
    // Auto-role
    const autoRole = guild.roles.cache.find(role => role.name === 'Member');
    if (autoRole) {
      try {
        await member.roles.add(autoRole);
      } catch (error) {
        console.error('Error adding auto-role:', error);
      }
    }
    
    // Check milestone alerts
    client.alerts.forEach((alert, id) => {
      if (alert.type === 'milestone' && alert.guildId === guild.id) {
        if (guild.memberCount >= alert.count) {
          // Execute milestone alert
          executeMilestoneAlert(id, alert, client);
        }
      }
    });
  }
};

async function executeMilestoneAlert(id, alert, client) {
  try {
    const guild = await client.guilds.fetch(alert.guildId);
    const channel = await client.channels.fetch(alert.channelId);
    if (channel?.isTextBased()) {
      await channel.send({ content: alert.message });
      // Remove alert after execution
      client.alerts.delete(id);
      await saveAlerts(client);
    }
  } catch (error) {
    console.error(`Error executing milestone alert ${id}:`, error);
  }
}
