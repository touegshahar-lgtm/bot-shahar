// ./events/messageCreate.js
const { EmbedBuilder } = require('discord.js');

module.exports = {
  name: 'messageCreate',
  async execute(message, client) {
    // Ignore bots
    if (message.author.bot) return;

    // Bad word filter
    const badWords = ['badword1', 'badword2']; // Replace with your list
    const messageContent = message.content.toLowerCase();
    
    for (const word of badWords) {
      if (messageContent.includes(word)) {
        try {
          await message.delete();
          await message.author.send(`⚠️ Your message contained inappropriate language and was removed.`);
        } catch (e) {
          // If can't DM user, send in channel
          await message.channel.send(`${message.author}, your message contained inappropriate language and was removed.`);
        }
        return;
      }
    }

    // XP System
    if (message.channel.type !== 1) { // Not DM
      const userId = message.author.id;
      const guildId = message.guild.id;
      const key = `${guildId}-${userId}`;
      
      // Initialize XP if not exists
      if (!client.xp.has(key)) {
        client.xp.set(key, { xp: 0, level: 1, lastMessage: 0 });
      }
      
      const userData = client.xp.get(key);
      const now = Date.now();
      
      // Prevent spamming XP
      if (now - userData.lastMessage < 60000) return;
      
      // Add XP (5-15 points per message)
      const xpGain = Math.floor(Math.random() * 11) + 5;
      userData.xp += xpGain;
      userData.lastMessage = now;
      
      // Level up calculation
      const xpNeeded = Math.floor(Math.pow(userData.level, 2) * 100);
      if (userData.xp >= xpNeeded) {
        userData.level++;
        userData.xp = 0;
        
        // Level up announcement
        const levelUpEmbed = new EmbedBuilder()
          .setColor('#00ff00')
          .setTitle('🎉 Level Up!')
          .setDescription(`${message.author} has leveled up to level ${userData.level}!`)
          .setThumbnail(message.author.displayAvatarURL());
        
        // Send in leveling channel if configured
        const levelingChannel = message.guild.channels.cache.find(ch => ch.name === 'leveling');
        if (levelingChannel && levelingChannel.isTextBased()) {
          levelingChannel.send({ embeds: [levelUpEmbed] });
        } else {
          message.channel.send({ embeds: [levelUpEmbed] });
        }
      }
      
      client.xp.set(key, userData);
    }
  }
};
