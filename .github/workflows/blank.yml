// ./commands/moderation/ban.js
const { SlashCommandBuilder, EmbedBuilder } = require('discord.js');

module.exports = {
  data: new SlashCommandBuilder()
    .setName('ban')
    .setDescription('Ban a user')
    .addUserOption(option => 
      option.setName('user')
        .setDescription('The user to ban')
        .setRequired(true))
    .addIntegerOption(option => 
      option.setName('days')
        .setDescription('Number of days of messages to delete (0-7)')
        .setRequired(false))
    .addStringOption(option => 
      option.setName('reason')
        .setDescription('Reason for banning')
        .setRequired(false)),
  async execute(interaction, client) {
    // Check permissions
    if (!interaction.member.permissions.has(PermissionsBitField.Flags.BanMembers)) {
      return interaction.reply({ content: '❌ You do not have permission to use this command!', ephemeral: true });
    }
    
    const user = interaction.options.getUser('user');
    const days = interaction.options.getInteger('days') || 0;
    const reason = interaction.options.getString('reason') || 'No reason provided';
    
    try {
      await interaction.guild.members.ban(user.id, { days, reason });
      const embed = new EmbedBuilder()
        .setColor('#ff0000')
        .setTitle('✅ User Banned')
        .addFields(
          { name: 'User', value: user.tag, inline: true },
          { name: 'Moderator', value: interaction.user.tag, inline: true },
          { name: 'Days of messages deleted', value: days.toString(), inline: true },
          { name: 'Reason', value: reason }
        )
        .setTimestamp();
      
      await interaction.reply({ embeds: [embed] });
      
      // Send DM to banned user
      try {
        await user.send(`You have been banned from ${interaction.guild.name} for: ${reason}`);
      } catch (e) {
        // If DM fails, ignore
      }
    } catch (error) {
      console.error(error);
      await interaction.reply({ content: '❌ Failed to ban user. Make sure I have the proper permissions.', ephemeral: true });
    }
  }
};
