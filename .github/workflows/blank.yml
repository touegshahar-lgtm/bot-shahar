// ./events/presenceUpdate.js
module.exports = {
  name: 'presenceUpdate',
  async execute(oldPresence, newPresence, client) {
    if (!newPresence || !newPresence.guild || !newPresence.member) return;
    
    // Check online alerts
    client.alerts.forEach((alert, id) => {
      if (alert.type === 'online' && alert.userId === newPresence.userId && alert.guildId === newPresence.guild.id) {
        // Check if user came online
        if (oldPresence?.status !== 'online' && newPresence.status === 'online') {
          executeAlert(id, alert, client);
        }
      }
    });
  }
};

async function executeAlert(id, alert, client) {
  try {
    const channel = await client.channels.fetch(alert.channelId);
    if (channel?.isTextBased()) {
      const user = await client.users.fetch(alert.userId);
      await channel.send({ content: alert.message.replace('{user}', `<@${user.id}>`) });
    }
  } catch (error) {
    console.error(`Error executing online alert ${id}:`, error);
  }
}
