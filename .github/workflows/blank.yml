```javascript
// ./commands/moderation/warn.js
const { SlashCommandBuilder, EmbedBuilder } = require('discord.js');

module.exports = {
  data: new SlashCommandBuilder()
    .setName('warn')
    .setDescription('Warn a user')
    .addUserOption(option => 
      option.setName('user')
        .setDescription('The user to warn')
        .setRequired(true))
    .addStringOption(option => 
      option.setName('reason')
        .setDescription('Reason for warning')
        .setRequired(false)),
  async execute(interaction, client) {
    // Check permissions
    if (!interaction.member.permissions.has(PermissionsBitField.Flags.KickMembers)) {
      return interaction.reply({ content: '❌ You do not have permission to use this command!', ephemeral: true });
    }
    
    const user = interaction.options.getUser('user');
    const reason = interaction.options.getString('reason') || 'No reason provided';
    
    try {
      await interaction.guild.members.ban(user.id, { reason });
      const embed = new EmbedBuilder()
        .setColor('#ff0000')
        .setTitle('✅ User Warned')
        .addFields(
          { name: 'User', value: user.tag, inline: true },
          { name: 'Moderator', value: interaction.user.tag, inline: true },
          { name: 'Reason', value: reason }
        )
        .setTimestamp();
      
      await interaction.reply({ embeds: [embed] });
      
      // Send DM to warned user
      try {
        await user.send(`You have been warned in ${interaction.guild.name} for: ${reason}`);
      } catch (e) {
        // If DM fails, ignore
      }
    } catch (error) {
      console.error(error);
      await interaction.reply({ content: '❌ Failed to warn user. Make sure I have the proper permissions.', ephemeral: true });
    }
  }
};
```

