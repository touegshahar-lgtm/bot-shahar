const { SlashCommandBuilder, EmbedBuilder } = require('discord.js');

module.exports = {
  data: new SlashCommandBuilder()
    .setName('welcome')
    .setDescription('Configure welcome settings')
    .addSubcommand(subcommand =>
      subcommand
        .setName('set-channel')
        .setDescription('Set the welcome channel')
        .addChannelOption(option =>
          option.setName('channel')
            .setDescription('The channel to send welcome messages')
            .setRequired(true)))
    .addSubcommand(subcommand =>
      subcommand
        .setName('set-message')
        .setDescription('Set the welcome message')
        .addStringOption(option =>
          option.setName('message')
            .setDescription('The welcome message template')
            .setRequired(true))),
  async execute(interaction, client) {
    // Check permissions
    if (!interaction.member.permissions.has(PermissionsBitField.Flags.ManageGuild)) {
      return interaction.reply({ content: '❌ You do not have permission to use this command!', ephemeral: true });
    }
    
    const subcommand = interaction.options.getSubcommand();
    
    if (subcommand === 'set-channel') {
      const channel = interaction.options.getChannel('channel');
      // Store in database or config
      await interaction.reply({ content: `✅ Welcome channel set to ${channel}`, ephemeral: true });
    } else if (subcommand === 'set-message') {
      const message = interaction.options.getString('message');
      // Store in database or config
      await interaction.reply({ content: `✅ Welcome message set to: ${message}`, ephemeral: true });
    }
  }
};
